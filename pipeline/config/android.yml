# Iterable Android SDK — docs refresh config.
#
# `pnpm refresh:docs` reads this file: it pulls each `articles[].source_path`
# from `source.repo` at `source.ref`, applies the deterministic transforms, and
# writes `paths.reference_dir`/<slug>.md — the corpus the skill reads. One
# stage, no intermediate directories, no LLM.
#
# Bump `source.ref` deliberately when re-fetching so diffs against the
# previous run reflect upstream changes only.

platform: android

source:
  repo: Iterable/iterable-docs
  ref: 59c40504c91bc0b13751c5ef5f348810eb0fd4f2
  ref_label: "master @ 2026-08-03"

sdk:
  repo: Iterable/iterable-android-sdk
  tag: 3.7.0
  artifact: iterableapi
  changelog_path: CHANGELOG.md

paths:
  reference_dir: iterable-android/reference

articles:
  - slug: android-sdk
    source_path: docs/developer-and-api-docs/iterables-ios-and-android-sdks/android-sdk/index.md
    feature: integration
    archetype: integration

  - slug: in-app-messages-on-android
    source_path: docs/developer-and-api-docs/in-app-messages/in-app-messages-on-android/index.md
    feature: in-app-messages
    archetype: feature

