# Iterable React Native SDK — docs refresh config.
#
# `pnpm refresh:docs` reads this file (and every other top-level platform
# config) in one pass: it pulls each `articles[].source_path` from
# `source.repo` at `source.ref`, applies the deterministic transforms, and
# writes `paths.reference_dir`/<slug>.md — the corpus the skill reads.
#
# Bump `source.ref` deliberately when re-fetching so diffs against the
# previous run reflect upstream changes only. The auto-refresh workflow pins
# only platforms whose corpus actually changed.
#
# Expo is one article in this set, not a separate platform. The second
# package for Expo projects (`@iterable/expo-plugin`) is recorded in
# SKILL.md / PITFALLS.md, not in `sdk.tag` (that pin is the RN SDK). It stays
# at 1.1.0: npm's 1.2.0 is deprecated ("Published accidentally; use 1.1.0
# instead") and built from the same commit.
#
# 3.2.1, not 3.2.0: 3.2.0's Android module did not compile against its own
# native pin (CHANGELOG 3.2.1).

platform: react-native

source:
  repo: Iterable/iterable-docs
  ref: 275e9063f5aa922a9c282d6d34a8aebec3d15448
  ref_label: "master @ 2026-09-11"

sdk:
  repo: Iterable/react-native-sdk
  tag: 3.2.1
  artifact: "@iterable/react-native-sdk"
  changelog_path: CHANGELOG.md

paths:
  reference_dir: iterable-react-native/reference

articles:
  - slug: overview
    source_path: docs/developer-and-api-docs/iterables-react-native-sdk/overview/index.md
    feature: integration
    archetype: integration

  - slug: installing
    source_path: docs/developer-and-api-docs/iterables-react-native-sdk/installing/index.md
    feature: integration
    archetype: integration

  - slug: authentication
    source_path: docs/developer-and-api-docs/iterables-react-native-sdk/authentication/index.md
    feature: jwt-authentication
    archetype: identity

  - slug: managing-user-identity
    source_path: docs/developer-and-api-docs/iterables-react-native-sdk/managing-user-identity/index.md
    feature: user-profiles
    archetype: identity

  - slug: push-notifications
    source_path: docs/developer-and-api-docs/iterables-react-native-sdk/push-notifications/index.md
    feature: push-notifications
    archetype: feature

  - slug: in-app-messages
    source_path: docs/developer-and-api-docs/iterables-react-native-sdk/in-app-messages/index.md
    feature: in-app-messages
    archetype: feature

  - slug: mobile-inbox
