name: Validate

# Blocking gates only: typecheck, reference-corpus frontmatter + config/corpus
# slug agreement, and plugin manifests. Every gate here can actually fail.

on:
  push:
    branches: [main]
    paths:
      - iterable-android/**
      - iterable-react-native/**
      - pipeline/**
      - .claude-plugin/**
      - .cursor-plugin/**
      - mcp.json
      - .mcp.json
      - context7.json
      - .github/workflows/validate.yml
  pull_request:
    branches: [main]
    paths:
      - iterable-android/**
      - iterable-react-native/**
      - pipeline/**
      - .claude-plugin/**
      - .cursor-plugin/**
      - mcp.json
      - .mcp.json
      - context7.json
      - .github/workflows/validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pipeline/pnpm-lock.yaml

      - name: Install pipeline deps
        working-directory: pipeline
        run: pnpm install --frozen-lockfile

      - name: Run all gates
        working-directory: pipeline
        run: pnpm check:all
