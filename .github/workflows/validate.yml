name: Validate

# Blocking gates only: typecheck, reference-corpus frontmatter + config/corpus
# slug agreement, and plugin manifests. Every gate here can actually fail.

on:
  push:
    branches: [main]
    paths:
      - iterable-android/**
      - iterable-react-native/**
      - iterable-provision/**
      - iterable-verify/**
      - pipeline/**
      - bin/**
      - tests/**
      - agents/**
      - Makefile
      - .claude-plugin/**
      - .cursor-plugin/**
      - mcp.json
      - .mcp.json
      - context7.json
      - .github/workflows/validate.yml
  pull_request:
    branches: [main]
    paths:
      - iterable-android/**
      - iterable-react-native/**
      - iterable-provision/**
      - iterable-verify/**
      - pipeline/**
      - bin/**
      - tests/**
      - agents/**
      - Makefile
      - .claude-plugin/**
      - .cursor-plugin/**
      - mcp.json
      - .mcp.json
      - context7.json
      - .github/workflows/validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pipeline/pnpm-lock.yaml

      - name: Install pipeline deps
        working-directory: pipeline
        run: pnpm install --frozen-lockfile

      - name: Run all gates
        working-directory: pipeline
        run: pnpm check:all

  # The onboarding tool is shell, and none of it was reachable from CI: nineteen suites
  # existed and nothing ran them.
  #
  # macOS because that is where the tool runs — an Android developer with Xcode, adb and
  # gcloud on the same machine — and because its /bin/bash is 3.2, so it fails on a bash-4
  # construct that ubuntu would accept. expect ships with macOS, so the four interactive
  # suites run here too.
  shell:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the shell suites
        run: tests/run-all.sh
