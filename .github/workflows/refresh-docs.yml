name: Refresh docs

# Triggered when Iterable/iterable-docs publishes a change to an SDK doc
# path. The docs repo dispatches `iterable-docs-changed` (optionally with a
# `client_payload.ref` = the docs commit); this workflow resolves that ref
# (or the docs default-branch head on a manual run), rewrites every
# configured platform's `reference/` from the docs at that commit, bumps the
# pinned `source.ref` only for platforms whose corpus changed, and opens one
# PR. There is no LLM step — the corpus is the docs reshaped.
#
# `workflow_dispatch` is kept as a manual fallback for re-running a
# refresh outside of a docs-side trigger (e.g. when validating a config
# change on this repo).

on:
  repository_dispatch:
    types: [iterable-docs-changed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pipeline/pnpm-lock.yaml

      - name: Install pipeline deps
        working-directory: pipeline
        run: pnpm install --frozen-lockfile

      - name: Resolve source ref
        id: ref
        env:
          # iterable-docs is a PRIVATE repo, so the built-in GITHUB_TOKEN (scoped
          # to this repo only) 404s on it. DOCS_READ_TOKEN is a fine-grained PAT
          # with Contents+Metadata read on Iterable/iterable-docs.
          GH_TOKEN: ${{ secrets.DOCS_READ_TOKEN }}
          # The docs commit that triggered the dispatch, if any. Empty on a
          # manual workflow_dispatch → we resolve the docs default branch head.
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
        run: |
          set -euo pipefail
          docs_repo="Iterable/iterable-docs"
          req="${PAYLOAD_REF:-}"
          if [[ -z "$req" ]]; then
            req=$(gh api "repos/${docs_repo}" --jq '.default_branch')
          fi
          # Resolve whatever we have (branch name or sha) to a full commit sha,
          # so the pin we write back is immutable and reproducible.
          sha=$(gh api "repos/${docs_repo}/commits/${req}" --jq '.sha')
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "label=master @ $(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Resolved ${req} → ${sha}"

      - name: Refresh reference corpora (reads private iterable-docs via gh api)
        working-directory: pipeline
        env:
          GH_TOKEN: ${{ secrets.DOCS_READ_TOKEN }}
          SOURCE_REF: ${{ steps.ref.outputs.sha }}
        run: pnpm refresh:docs

      - name: Detect changes
        id: changes
        working-directory: pipeline
        run: pnpm detect:corpus-changes

      - name: Bump pinned source ref
        if: steps.changes.outputs.changed == 'true'
        working-directory: pipeline
        env:
          SHA: ${{ steps.ref.outputs.sha }}
          LABEL: ${{ steps.ref.outputs.label }}
          PLATFORMS: ${{ steps.changes.outputs.platforms }}
        run: |
          set -euo pipefail
          IFS=',' read -ra plats <<< "$PLATFORMS"
          for p in "${plats[@]}"; do
            pnpm set:source-ref -- "$p" "$SHA" "$LABEL"
          done

      - name: Open refresh PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: refresh/${{ github.run_id }}
          base: main
          delete-branch: true
          title: "docs refresh (${{ steps.changes.outputs.platforms }}): ${{ steps.changes.outputs.slugs }}"
          commit-message: |
            docs refresh (${{ steps.changes.outputs.platforms }}): Layer A only

            Slugs: ${{ steps.changes.outputs.slugs }}
          body: |
            Automated refresh of platform `reference/` corpora — the docs the
            skills read. **No LLM step**: the corpus is a deterministic
            transform of Iterable's published docs.

            **Platforms changed:** `${{ steps.changes.outputs.platforms }}`
            **Slugs touched:** ${{ steps.changes.outputs.slugs }}
            **Docs commit:** `${{ steps.ref.outputs.sha }}`
            (`source.ref` in each changed platform's `pipeline/config/<platform>.yml`
            is bumped to this in the diff).

            ## Reviewer steps

            1. Read the diff as docs, not code — this is what the agent will
               tell developers to do. Check that changed guidance still agrees
               with that platform's `PITFALLS.md`; if the docs now contradict a
               pitfall, the pitfall needs updating in the same PR.
            2. If a slug's headings moved, check the routing table in that
               platform's `SKILL.md` still points at sections that exist.
            3. Confirm the `source.ref` bump in `pipeline/config` matches the
               docs commit above (provenance stays honest). Unchanged platforms
               must not appear in the diff.
            4. Merge to `main`. Context7 re-indexes on its next crawl
               (`context7.json` controls scope).
          labels: |
            docs-refresh
            automated
